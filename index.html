<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helium — JEE Formula &amp; Revision Notes</title>

  <!-- Prevent theme flash before initial paint -->
  <script>
    (function () {
      const saved = localStorage.getItem("helium-theme");
      const valid = ["light", "dark", "amber", "emerald"].includes(saved) ? saved : "amber";
      document.documentElement.setAttribute("data-theme", valid);
    })();
  </script>

  <!-- KaTeX Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous" />
  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Marked.js (Markdown Parser) -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <!-- KaTeX Core, mhchem Extension, and Auto-Render -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/mhchem.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <!-- Application Scripts -->
  <script defer src="js/chapters.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-toggle" class="icon-btn" aria-label="Toggle navigation menu" title="Toggle Menu">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="#" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2.2" fill="currentColor"></circle>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(35 12 12)"></ellipse>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-35 12 12)"></ellipse>
        </svg>
        <span class="brand-name">Helium</span>
      </a>
    </div>

    <div class="topbar-right">
      <button id="print-btn" class="icon-btn" aria-label="Print or export as PDF" title="Print / Export PDF">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>

      <div class="theme-control" title="Select Color Theme">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"></path>
        </svg>
        <select id="theme-select" class="theme-select" aria-label="Select Color Theme">
          <option value="light">Light</option>
          <option value="dark">Cosmic Black</option>
          <option value="amber">Amber CRT</option>
          <option value="emerald">Emerald &amp; Gold</option>
        </select>
        <svg class="theme-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar" aria-label="Chapter Navigation">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Filter chapters..." autocomplete="off" aria-label="Filter chapters" />
      </div>
      <nav id="chapter-nav" class="chapter-nav"></nav>
    </aside>

    <!-- Mobile Navigation Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <article id="note-container" class="markdown-body">
        <p class="loading">Loading chapter notes...</p>
      </article>

      <footer id="chapter-pager" class="chapter-pager"></footer>
    </main>
  </div>
</body>
</html>
